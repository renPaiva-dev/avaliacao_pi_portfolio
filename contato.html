<!-- contato.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | Pedro Sanchez</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <h1>Pedro Sanchez</h1>
        </div>

        <!-- Navegação -->
        <nav>
            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Sobre mim
                    </a>
                </li>

                <li>
                    <a href="projetos.html">
                        Projetos
                    </a>
                </li>

                <li>
                    <a href="contato.html">
                        Contato
                    </a>
                </li>

            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Seção de contato -->
        <section class="contact-section">

            <h2>Entre em Contato</h2>

            <p>
                Caso queira conversar sobre projetos,
                oportunidades ou tecnologia, envie
                uma mensagem pelo formulário abaixo.
            </p>

            <!-- Formulário -->
            <form action="#" method="post">

                <!-- Campo nome -->
                <div class="form-group">

                    <label for="nome">
                        Nome:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <!-- Campo email -->
                <div class="form-group">

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <!-- Campo assunto -->
                <div class="form-group">

                    <label for="assunto">
                        Assunto:
                    </label>

                    <input
                        type="text"
                        id="assunto"
                        name="assunto"
                        placeholder="Digite o assunto"
                        required
                    >

                </div>

                <!-- Campo mensagem -->
                <div class="form-group">

                    <label for="mensagem">
                        Mensagem:
                    </label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="6"
                        placeholder="Digite sua mensagem"
                        required
                    ></textarea>

                </div>

                <!-- Botão -->
                <button type="submit">
                    Enviar Mensagem
                </button>

            </form>

        </section>

    </main>

    <!-- Rodapé -->
    <footer>

        <p>
            © 2026 Pedro Sanchez - Todos os direitos reservados.
        </p>

    </footer>

</body>
</html>
